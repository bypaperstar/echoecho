<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>echoecho</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: linear-gradient(170deg, #14151b 0%, #0e0f14 100%);
      color: #e6e8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }
    .wrap { padding: 22px 26px 18px; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
    .head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .head canvas { width: 52px; height: 52px; }
    .head h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
    .head .sub { font-size: 11.5px; color: #8a91a2; margin-top: 2px; }

    .status { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.07);
              border-radius: 12px; padding: 4px 14px; margin-bottom: 16px; }
    .row { display: flex; align-items: center; justify-content: space-between;
           padding: 9px 0; font-size: 13px; }
    .row + .row { border-top: 1px solid rgba(255,255,255,0.05); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
           margin-right: 9px; vertical-align: 1px; background: #4a4f5e; }
    .dot.on { background: #59d08a; box-shadow: 0 0 6px rgba(89,208,138,0.55); }
    .dot.off { background: #d06459; }
    .val { color: #9aa1b3; font-size: 12px; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    button {
      appearance: none; border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.055); color: #e6e8ee;
      border-radius: 10px; padding: 10px 8px; font-size: 12.5px; font-weight: 550;
      cursor: pointer; font-family: inherit;
    }
    button:hover { background: rgba(255,255,255,0.10); }
    button:active { background: rgba(255,255,255,0.14); }
    button.primary {
      grid-column: 1 / -1;
      background: rgba(126,168,255,0.16); border-color: rgba(126,168,255,0.4);
      color: #cfe0ff; padding: 12px; font-size: 13.5px;
    }
    button.primary:hover { background: rgba(126,168,255,0.24); }
    button.danger { border-color: rgba(208,100,89,0.4); color: #f0b9b2; }
    button:disabled { opacity: 0.45; cursor: default; }

    .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between;
            padding-top: 14px; font-size: 11.5px; color: #767d8f; }
    .foot label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #note { font-size: 11px; color: #8a91a2; min-height: 14px; margin-top: 10px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <canvas id="icon" width="104" height="104"></canvas>
      <div>
        <h1>echoecho</h1>
        <div class="sub" id="version">—</div>
      </div>
    </div>

    <div class="status">
      <div class="row"><span><span class="dot" id="d-daemon"></span>Voice daemon</span><span class="val" id="v-daemon">checking…</span></div>
      <div class="row"><span><span class="dot" id="d-vm"></span>echoecho's Mac (VM)</span><span class="val" id="v-vm">checking…</span></div>
      <div class="row"><span><span class="dot on" id="d-orb"></span>Orb scene</span><span class="val" id="v-orb">hidden</span></div>
    </div>

    <div class="actions">
      <button class="primary" id="b-summon">Summon echoecho ✦</button>
      <button id="b-daemon">Start daemon</button>
      <button id="b-vm">Wake echoecho's Mac</button>
      <button id="b-reset" class="danger">Reset echoecho's Mac</button>
      <button id="b-update">Update &amp; relaunch</button>
    </div>
    <div id="note"></div>

    <div class="foot">
      <label><input type="checkbox" id="login" /> Start at login</label>
      <button id="b-quit" style="padding:6px 12px">Quit echoecho</button>
    </div>
  </div>
  <script src="control.js"></script>
</body>
</html>

name: App checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      ECHOECHO_VIEWER_TOKEN_FILE: ${{ runner.temp }}/echoecho-viewer.token
      ECHOECHO_DIAGNOSTICS_DIR: ${{ runner.temp }}/echoecho-diagnostics
      ECHOECHO_PREFERENCES_FILE: ${{ runner.temp }}/echoecho-preferences.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: pip install -r requirements.txt pytest pytest-asyncio numpy livekit==1.1.14
      - run: python -m pytest tests/ -q
      - run: npm ci --no-fund
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm audit --audit-level=moderate
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:ui
        working-directory: app
      - run: bash -n scripts/echoechoctl.sh
